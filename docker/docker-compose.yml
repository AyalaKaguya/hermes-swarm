services:
  postgres:
    image: postgres:17-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hermes-swarm

  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-hermes_redis_pwd} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hermes_redis_pwd}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hermes-swarm

  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    container_name: hermes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hermes_minio_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hermes_minio_root_change_me}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3100}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hermes-swarm

  minio-init:
    profiles: ["storage"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: hermes-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-hermes_local_app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-hermes_local_app_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-hermes-files}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hermes_minio_root_change_me}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hermes_minio_root}
    entrypoint: ["/bin/sh", "/config/init.sh"]
    volumes:
      - ./init/minio:/config:ro
    networks:
      - hermes-swarm

networks:
  hermes-swarm:
    name: hermes-swarm

volumes:
  minio-data:
